<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'">
<title>Sift</title><link rel="stylesheet" href="styles.css"></head>
<body class="wheel-mode">
<main id="wheel-view" aria-label="Sift circular file menu">
<svg id="wheel" viewBox="0 0 400 400" aria-label="Drop a file on a format. Right click or press Tab for tools.">
<defs>
<linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="75" y1="30" x2="320" y2="380"><stop stop-color="#ffffff" stop-opacity=".20"/><stop offset=".5" stop-color="#e6edf0" stop-opacity=".10"/><stop offset="1" stop-color="#d6e0e5" stop-opacity=".19"/></linearGradient>
<radialGradient id="petal" gradientUnits="userSpaceOnUse" cx="115" cy="60" r="355"><stop stop-color="#ffffff" stop-opacity=".62"/><stop offset=".42" stop-color="#f4f7f8" stop-opacity=".44"/><stop offset="1" stop-color="#e3e9ed" stop-opacity=".30"/></radialGradient>
<linearGradient id="glass-edge" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset=".34" stop-color="#ffffff" stop-opacity=".43"/><stop offset=".66" stop-color="#35444e" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient>
<linearGradient id="rim-edge" gradientUnits="userSpaceOnUse" x1="85" y1="20" x2="305" y2="385"><stop stop-color="#ffffff" stop-opacity=".9"/><stop offset=".43" stop-color="#ffffff" stop-opacity=".32"/><stop offset=".7" stop-color="#26343e" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".68"/></linearGradient>
<radialGradient id="selected" gradientUnits="userSpaceOnUse" cx="200" cy="200" r="184"><stop offset=".36" stop-color="#ffc77d" stop-opacity=".25"/><stop offset=".47" stop-color="#ffaf52" stop-opacity=".62"/><stop offset=".7" stop-color="#ef7a22" stop-opacity=".91"/><stop offset=".9" stop-color="#d65a0c" stop-opacity=".97"/><stop offset="1" stop-color="#a93b04" stop-opacity=".98"/></radialGradient>
<linearGradient id="control-glass" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ffffff" stop-opacity=".80"/><stop offset=".48" stop-color="#f4f7f9" stop-opacity=".64"/><stop offset="1" stop-color="#dce5eb" stop-opacity=".52"/></linearGradient>
<filter id="glass-relief" x="0" y="0" width="400" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feOffset in="SourceAlpha" dx=".5" dy="1.6" result="lower-alpha"/><feComposite in="SourceAlpha" in2="lower-alpha" operator="arithmetic" k2="1" k3="-1" result="upper-edge"/><feFlood flood-color="#ffffff" flood-opacity=".88"/><feComposite in2="upper-edge" operator="in" result="highlight"/>
<feOffset in="SourceAlpha" dx="-.4" dy="-1.8" result="upper-alpha"/><feComposite in="SourceAlpha" in2="upper-alpha" operator="arithmetic" k2="1" k3="-1" result="lower-edge"/><feFlood flood-color="#152532" flood-opacity=".34"/><feComposite in2="lower-edge" operator="in" result="shade"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="highlight"/></feMerge></filter>
</defs>
<path class="rim" fill-rule="evenodd" d="M200 16a184 184 0 1 1 0 368a184 184 0 1 1 0-368Z M200 132a68 68 0 1 1 0 136a68 68 0 1 1 0-136Z" aria-hidden="true"/><circle class="rim-inner-edge" cx="200" cy="200" r="181.5" aria-hidden="true"/><circle class="rim-aperture-edge" cx="200" cy="200" r="68.8" aria-hidden="true"/><g id="wedges"></g>
<g id="center" role="button" tabindex="0" aria-label="Choose files"><circle class="center-well" cx="200" cy="200" r="65"/><rect class="center-pill" x="147" y="175" width="106" height="50" rx="25"/><text id="center-label" x="200" y="205" text-anchor="middle">Choose</text><title id="center-title">Choose files · Ctrl+O. Right click or Tab switches formats and tools.</title></g>
<g id="wheel-switch" role="button" tabindex="0" aria-label="Show image tools" aria-controls="wedges" aria-keyshortcuts="Tab"><rect x="162" y="232" width="76" height="22" rx="11"/><text id="wheel-switch-label" x="200" y="247" text-anchor="middle">Tools ›</text><title id="wheel-switch-title">Show image tools · Tab</title></g></svg>
<div id="wheel-hint" aria-hidden="true">Drag · Shift · Drop</div></main>
<section id="editor-view" class="hidden" aria-label="Image editor">
<header class="editor-titlebar"><button id="editor-close" class="close-button" aria-label="Close editor">×</button><h1 id="editor-title">Crop Image</h1><span class="title-spacer"></span></header>
<div class="editor-content"><div id="preview-stage" class="preview-stage"><div id="image-plane"><img id="preview-image" alt="Image being edited" draggable="false"><div id="selection" class="hidden"><span data-handle="nw"></span><span data-handle="n"></span><span data-handle="ne"></span><span data-handle="e"></span><span data-handle="se"></span><span data-handle="s"></span><span data-handle="sw"></span><span data-handle="w"></span></div><div id="annotation-preview"></div></div><img id="processed-preview" class="hidden" alt="Background preview" draggable="false"><div id="preview-loading" class="hidden">Preparing preview…</div></div>
<div id="metadata-list" class="hidden"></div><div id="editor-controls"></div><p id="editor-error" role="alert"></p></div>
<footer class="editor-footer"><button id="reset-editor" class="subtle-button">Reset</button><span id="editor-progress" aria-live="polite"></span><button id="apply-editor" class="primary-button">Apply</button></footer></section>
<aside id="notice" class="hidden" role="status"><span id="notice-text"></span><button id="reveal-result" class="hidden">Show</button><button id="notice-close" aria-label="Dismiss">×</button></aside>
<script src="drop-policy.js"></script><script src="ingestion-gate.js"></script><script src="wheel-geometry.js"></script><script src="wheel-sound.js"></script><script src="renderer.js"></script></body></html>
